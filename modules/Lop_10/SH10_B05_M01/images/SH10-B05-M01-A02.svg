<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-labelledby="title desc">
  <title id="title">Cấu trúc vòng của glucose</title>
  <desc id="desc">Biểu diễn Haworth beta-D-glucopyranose, vòng sáu thành viên gồm năm carbon và một oxygen.</desc>
  <style>
    .ring-line { fill: none; stroke: #1A1A1A; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .bond-line { fill: none; stroke: #1A1A1A; stroke-width: 4.5; stroke-linecap: round; }
    .atom-text {
      font-family: 'Be Vietnam Pro', system-ui, sans-serif;
      font-size: 26px;
      font-weight: 700;
      fill: #1A1A1A;
      text-anchor: middle;
      dominant-baseline: central;
      paint-order: stroke fill;
      stroke: #FFFFFF;
      stroke-width: 8px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .atom-o {
      font-family: 'Be Vietnam Pro', system-ui, sans-serif;
      font-size: 32px;
      font-weight: 800;
      fill: #1B5E48;
      text-anchor: middle;
      dominant-baseline: central;
      paint-order: stroke fill;
      stroke: #FFFFFF;
      stroke-width: 12px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>

  <!-- 1. Vòng 6 cạnh Haworth (vòng hở tại O để không cắt qua chữ O) -->
  <g class="ring-line">
    <path d="M 137 274 L 142 126 L 240 82" />
    <path d="M 300 82 L 398 132 L 390 276 L 267 342 L 137 274" />
  </g>

  <!-- 2. Các liên kết nhánh đến nhóm chức (đầu mút dừng trước vùng chữ) -->
  <g class="bond-line">
    <!-- C1 (398, 132) -->
    <line x1="398" y1="122" x2="398" y2="96" />
    <line x1="408" y1="132" x2="434" y2="132" />

    <!-- C2 (390, 276) -->
    <line x1="400" y1="276" x2="428" y2="276" />
    <line x1="390" y1="286" x2="390" y2="318" />

    <!-- C3 (267, 342) -->
    <line x1="267" y1="332" x2="267" y2="304" />
    <line x1="267" y1="352" x2="267" y2="380" />

    <!-- C4 (137, 274) -->
    <line x1="127" y1="274" x2="98" y2="274" />
    <line x1="137" y1="284" x2="137" y2="318" />

    <!-- C5 (142, 126) - Nhánh H hướng ra ngoài bên trái, KHÔNG đè lên nét vòng -->
    <line x1="134" y1="116" x2="110" y2="88" />
    <line x1="132" y1="134" x2="102" y2="158" />
  </g>

  <!-- 3. Nhãn các nhóm chức (vị trí thoáng, không bị che khuất) -->
  <g class="atom-text">
    <!-- C1 -->
    <text x="398" y="74">H</text>
    <text x="472" y="132">OH</text>

    <!-- C2 -->
    <text x="452" y="276">H</text>
    <text x="390" y="346">OH</text>

    <!-- C3 -->
    <text x="267" y="282">H</text>
    <text x="267" y="404">OH</text>

    <!-- C4 (Glucose: OH hướng xuống, H hướng sang trái) -->
    <text x="74" y="274">H</text>
    <text x="137" y="346">OH</text>

    <!-- C5: CH2OH hướng chếch lên trái, H hướng chếch xuống trái hoàn toàn ngoài vòng -->
    <text x="62" y="66">CH₂OH</text>
    <text x="78" y="176">H</text>
  </g>

  <!-- Nguyên tử Oxygen trong vòng -->
  <text x="270" y="78" class="atom-o">O</text>
</svg>
