<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Các lớp trạng thái hình thành đường đôi</title>
  <desc id="desc">Tái sử dụng glucose và fructose, kèm các lớp độc lập để HTML lần lượt làm nổi bật nhóm tham gia, nước hình thành và liên kết glycosidic.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#514C44"/></marker>
  </defs>
  <g id="state-monosaccharides">
    <image href="SH10-B05-M01-A02.svg" x="30" y="50" width="440" height="330" preserveAspectRatio="xMidYMid meet"/>
    <image href="SH10-B05-M01-A04.svg" x="730" y="50" width="440" height="330" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="state-reactive-groups" opacity="0">
    <circle cx="395" cy="154" r="48" fill="#F7E7CD" fill-opacity=".7" stroke="#CE8A33" stroke-width="6" stroke-dasharray="10 8"/>
    <circle cx="782" cy="154" r="48" fill="#F7E7CD" fill-opacity=".7" stroke="#CE8A33" stroke-width="6" stroke-dasharray="10 8"/>
  </g>
  <g id="state-water" opacity="0">
    <path d="M535 195C535 155 600 91 600 91S665 155 665 195A65 65 0 1 1 535 195Z" fill="#DCE7EB" stroke="#4E7F92" stroke-width="6"/>
    <text x="600" y="215" text-anchor="middle" font-family="'Be Vietnam Pro',system-ui,sans-serif" font-size="38" font-weight="700" fill="#1A1A1A">H₂O</text>
    <path d="M600 285V360" fill="none" stroke="#514C44" stroke-width="6" marker-end="url(#arrow)"/>
  </g>
  <g id="state-glycosidic-link" opacity="0">
    <path d="M425 162C505 112 695 112 775 162" fill="none" stroke="#2D8B6F" stroke-width="10" stroke-linecap="round"/>
    <circle cx="600" cy="126" r="25" fill="#FFFFFF" stroke="#2D8B6F" stroke-width="6"/>
    <text x="600" y="137" text-anchor="middle" font-family="'Be Vietnam Pro',system-ui,sans-serif" font-size="30" font-weight="800" fill="#1B5E48">O</text>
  </g>
  <g id="state-controls-hint" opacity="0">
    <path d="M480 430H720" fill="none" stroke="#514C44" stroke-width="6" marker-end="url(#arrow)"/>
  </g>
</svg>
