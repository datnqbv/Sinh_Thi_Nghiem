<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc">
  <title id="title">Lớp mỡ dưới da góp phần cách nhiệt</title>
  <desc id="desc">Hai lát cắt da có cùng hình học, với lớp mỡ dưới da mỏng và rõ hơn; mũi tên truyền nhiệt ra ngoài có cường độ minh họa khác nhau.</desc>
  <defs><marker id="heat" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#C15F3C"/></marker></defs>
  <g fill="#FFFFFF" stroke="#D6CCB6" stroke-width="4"><rect x="25" y="25" width="700" height="600" rx="18"/><rect x="775" y="25" width="700" height="600" rx="18"/></g>
  <g id="thin-fat-state">
    <path d="M80 155C190 125 300 178 410 148S610 130 675 154V245H80Z" fill="#E3B08E" stroke="#A66C5A" stroke-width="5"/>
    <path d="M80 245H675V335C570 310 470 350 365 326S175 310 80 338Z" fill="#F1C46E" stroke="#CE8A33" stroke-width="5"/>
    <path d="M80 338C190 310 300 365 410 338S590 320 675 344V560H80Z" fill="#C98A7A" stroke="#965C50" stroke-width="5"/>
    <path d="M205 140V64M375 138V54M545 140V70" fill="none" stroke="#C15F3C" stroke-width="9" marker-end="url(#heat)"/>
  </g>
  <g id="thicker-fat-state">
    <path d="M830 155C940 125 1050 178 1160 148S1360 130 1425 154V245H830Z" fill="#E3B08E" stroke="#A66C5A" stroke-width="5"/>
    <path d="M830 245H1425V425C1320 395 1220 438 1115 410S925 395 830 425Z" fill="#F1C46E" stroke="#CE8A33" stroke-width="5"/>
    <path d="M830 425C940 395 1050 450 1160 423S1340 405 1425 430V560H830Z" fill="#C98A7A" stroke="#965C50" stroke-width="5"/>
    <path d="M1035 140V92M1205 138V82M1375 140V98" fill="none" stroke="#C15F3C" stroke-width="5" marker-end="url(#heat)"/>
  </g>
</svg>
