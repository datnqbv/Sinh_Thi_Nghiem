<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Triglyceride hoàn chỉnh</title>
  <desc id="desc">Một khung glycerol tạo ba liên kết ester với ba acid béo, gồm các nhánh được tái sử dụng từ asset acid béo no và không no.</desc>
  <g id="glycerol-backbone" font-family="'Be Vietnam Pro',system-ui,sans-serif" font-size="34" font-weight="700" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round">
    <path d="M180 210V550"/><circle cx="180" cy="210" r="13"/><circle cx="180" cy="380" r="13"/><circle cx="180" cy="550" r="13"/>
  </g>
  <g id="ester-link-1" fill="none" stroke="#1B5E48" stroke-width="8" stroke-linecap="round"><path d="M180 210H315"/><circle cx="250" cy="210" r="15" fill="#FFFFFF"/><text x="250" y="221" fill="#1B5E48" stroke="none" text-anchor="middle" font-family="'Be Vietnam Pro',system-ui,sans-serif" font-size="30" font-weight="800">O</text></g>
  <g id="ester-link-2" fill="none" stroke="#1B5E48" stroke-width="8" stroke-linecap="round"><path d="M180 380H315"/><circle cx="250" cy="380" r="15" fill="#FFFFFF"/><text x="250" y="391" fill="#1B5E48" stroke="none" text-anchor="middle" font-family="'Be Vietnam Pro',system-ui,sans-serif" font-size="30" font-weight="800">O</text></g>
  <g id="ester-link-3" fill="none" stroke="#1B5E48" stroke-width="8" stroke-linecap="round"><path d="M180 550H315"/><circle cx="250" cy="550" r="15" fill="#FFFFFF"/><text x="250" y="561" fill="#1B5E48" stroke="none" text-anchor="middle" font-family="'Be Vietnam Pro',system-ui,sans-serif" font-size="30" font-weight="800">O</text></g>
  <g id="fatty-acid-branch-1"><image href="SH10-B05-M02-A04.svg" x="280" y="45" width="1100" height="330" preserveAspectRatio="xMinYMid meet"/></g>
  <g id="fatty-acid-branch-2"><image href="SH10-B05-M02-A05.svg" x="280" y="215" width="1100" height="330" preserveAspectRatio="xMinYMid meet"/></g>
  <g id="fatty-acid-branch-3"><image href="SH10-B05-M02-A04.svg" x="280" y="385" width="1100" height="330" preserveAspectRatio="xMinYMid meet"/></g>
</svg>
