<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 700" role="img" aria-labelledby="title desc">
  <title id="title">Một phospholipid</title>
  <desc id="desc">Một đầu chứa phosphate liên kết với glycerol và hai đuôi acid béo, trong đó một đuôi có chỗ gấp cis.</desc>
  <g id="hydrophilic-head">
    <circle cx="210" cy="105" r="72" fill="#DCE7EB" stroke="#4E7F92" stroke-width="7"/>
    <text x="210" y="118" text-anchor="middle" font-family="'Be Vietnam Pro',system-ui,sans-serif" font-size="38" font-weight="800" fill="#1A1A1A">PO₄</text>
  </g>
  <g id="glycerol-link" fill="#DCEAE1" stroke="#1B5E48" stroke-width="6">
    <rect x="155" y="188" width="110" height="92" rx="20"/>
    <path d="M185 280V330M235 280V330" fill="none" stroke-linecap="round"/>
  </g>
  <g id="saturated-tail" fill="none" stroke="#1A1A1A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M185 330 145 380 185 430 145 480 185 530 145 580 185 630"/>
  </g>
  <g id="cis-tail" fill="none" stroke="#1A1A1A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M235 330 275 380 235 430 275 480 330 510 350 570 345 630"/>
    <path d="M238 426 278 476" stroke-width="5"/>
  </g>
  <g id="interaction-highlights" opacity="0" fill="none" stroke="#CE8A33" stroke-width="6" stroke-dasharray="11 9">
    <circle cx="210" cy="105" r="86"/><path d="M105 310H375V665H105Z"/>
  </g>
</svg>
