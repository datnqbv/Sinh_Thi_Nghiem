<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc">
  <title id="title">Tổng hợp cấu trúc ba nhóm lipid</title>
  <desc id="desc">Ba thẻ cùng kích thước tái sử dụng triglyceride, phospholipid và steroid đã học; nội dung đặc điểm và vai trò được HTML bổ sung.</desc>
  <g fill="#FFFFFF" stroke="#D6CCB6" stroke-width="4">
    <rect x="25" y="25" width="450" height="600" rx="20"/><rect x="525" y="25" width="450" height="600" rx="20"/><rect x="1025" y="25" width="450" height="600" rx="20"/>
  </g>
  <g id="triglyceride-card"><image href="SH10-B05-M02-A06.svg" x="55" y="90" width="390" height="440" preserveAspectRatio="xMidYMid meet"/></g>
  <g id="phospholipid-card"><image href="SH10-B05-M02-A13.svg" x="585" y="70" width="330" height="480" preserveAspectRatio="xMidYMid meet"/></g>
  <g id="steroid-card"><image href="SH10-B05-M02-A16.svg" x="1055" y="90" width="390" height="440" preserveAspectRatio="xMidYMid meet"/></g>
  <g id="html-text-safe-zones" opacity="0" fill="#FFFFFF">
    <rect x="55" y="535" width="390" height="65"/><rect x="555" y="535" width="390" height="65"/><rect x="1055" y="535" width="390" height="65"/>
  </g>
</svg>
