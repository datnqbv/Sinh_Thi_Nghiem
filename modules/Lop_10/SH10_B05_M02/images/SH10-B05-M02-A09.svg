<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 680" role="img" aria-labelledby="title desc">
  <title id="title">Đối chiếu dự trữ glycogen và triglyceride</title>
  <desc id="desc">Hai vùng cùng tỉ lệ khái quát: glycogen có nhiều phân tử nước minh họa và triglyceride nằm trong giọt mỡ của tế bào mỡ, gần như không kèm nước.</desc>
  <defs><g id="water"><circle r="12" fill="#DCE7EB" stroke="#4E7F92" stroke-width="3"/></g></defs>
  <g fill="#FFFFFF" stroke="#D6CCB6" stroke-width="4"><rect x="25" y="25" width="700" height="630" rx="20"/><rect x="775" y="25" width="700" height="630" rx="20"/></g>
  <g id="glycogen-store">
    <image href="../../SH10_B05_M01/images/SH10-B05-M01-A09.svg" x="105" y="145" width="520" height="350" preserveAspectRatio="xMidYMid meet"/>
    <g><use href="#water" x="95" y="105"/><use href="#water" x="172" y="92"/><use href="#water" x="250" y="118"/><use href="#water" x="334" y="88"/><use href="#water" x="425" y="115"/><use href="#water" x="526" y="90"/><use href="#water" x="627" y="115"/><use href="#water" x="90" y="535"/><use href="#water" x="184" y="566"/><use href="#water" x="286" y="535"/><use href="#water" x="397" y="560"/><use href="#water" x="520" y="538"/><use href="#water" x="634" y="562"/></g>
  </g>
  <g id="adipocyte-store">
    <circle cx="1125" cy="340" r="250" fill="#F5E7CB" stroke="#A66C5A" stroke-width="9"/>
    <circle cx="1125" cy="340" r="184" fill="#F1C46E" stroke="#CE8A33" stroke-width="7"/>
    <ellipse cx="1332" cy="478" rx="42" ry="28" fill="#6A5AA8" stroke="#443A78" stroke-width="5"/>
    <image href="SH10-B05-M02-A06.svg" x="970" y="235" width="310" height="210" preserveAspectRatio="xMidYMid meet" opacity=".8"/>
