<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Cấu trúc glycerol</title>
  <desc id="desc">Mạch ba carbon đúng hóa trị, mỗi carbon mang một nhóm hydroxyl; ba oxygen được tách thành các nhóm để giao diện xác định vị trí ester hóa.</desc>
  <g fill="none" stroke="#1A1A1A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M205 180H380H555"/>
    <path d="M205 180V90M380 180V90M555 180V90"/>
  </g>
  <g font-family="'Be Vietnam Pro',system-ui,sans-serif" font-size="38" font-weight="700" fill="#1A1A1A" text-anchor="middle">
    <text x="205" y="193">CH₂</text><text x="380" y="193">CH</text><text x="555" y="193">CH₂</text>
  </g>
  <g id="hydroxyl-1" font-family="'Be Vietnam Pro',system-ui,sans-serif" font-size="38" font-weight="700" fill="#1B5E48" text-anchor="middle"><text x="205" y="70">OH</text></g>
  <g id="hydroxyl-2" font-family="'Be Vietnam Pro',system-ui,sans-serif" font-size="38" font-weight="700" fill="#1B5E48" text-anchor="middle"><text x="380" y="70">OH</text></g>
  <g id="hydroxyl-3" font-family="'Be Vietnam Pro',system-ui,sans-serif" font-size="38" font-weight="700" fill="#1B5E48" text-anchor="middle"><text x="555" y="70">OH</text></g>
  <g id="ester-targets" fill="none" stroke="#CE8A33" stroke-width="5" stroke-dasharray="10 9" opacity="0">
    <circle cx="205" cy="57" r="49"/><circle cx="380" cy="57" r="49"/><circle cx="555" cy="57" r="49"/>
  </g>
</svg>
