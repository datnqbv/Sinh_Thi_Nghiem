<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc">
  <title id="title">Lipid hỗ trợ hấp thu vitamin tan trong dầu</title>
  <desc id="desc">Một pha lipid trong bữa ăn dẫn qua bốn vị trí thẻ vitamin do HTML gắn nhãn tới đoạn ruột non đơn giản hóa.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#4E7F92"/></marker></defs>
  <g id="meal-lipid">
    <ellipse cx="235" cy="425" rx="175" ry="58" fill="#E7DECC" stroke="#A89B84" stroke-width="6"/>
    <path d="M150 350C150 292 235 190 235 190S320 292 320 350A85 85 0 1 1 150 350Z" fill="#E8A24A" stroke="#CE8A33" stroke-width="7"/>
  </g>
  <g id="vitamin-card-targets" fill="#FFFFFF" stroke="#6A5AA8" stroke-width="6">
    <rect x="475" y="160" width="130" height="130" rx="18"/><rect x="635" y="160" width="130" height="130" rx="18"/>
    <rect x="475" y="330" width="130" height="130" rx="18"/><rect x="635" y="330" width="130" height="130" rx="18"/>
  </g>
