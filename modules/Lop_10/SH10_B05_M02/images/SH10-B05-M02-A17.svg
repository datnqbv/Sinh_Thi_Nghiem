<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 700" role="img" aria-labelledby="title desc">
  <title id="title">Vai trò và quan hệ tiền chất của cholesterol</title>
  <desc id="desc">Cholesterol được tái sử dụng từ A16 và tách thành hai nhánh: tham gia màng tế bào động vật, hoặc qua vùng nhiều bước chuyển hóa trước một số hormone steroid.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#4E7F92"/></marker></defs>
  <g id="cholesterol-source"><image href="SH10-B05-M02-A16.svg" x="30" y="190" width="430" height="300" preserveAspectRatio="xMinYMid slice"/></g>
  <g fill="none" stroke="#4E7F92" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"><path d="M450 340C555 340 555 155 675 155"/><path d="M450 350C555 350 555 545 675 545"/><path d="M920 545H1040"/></g>
  <g id="animal-membrane" transform="translate(700 75)">
