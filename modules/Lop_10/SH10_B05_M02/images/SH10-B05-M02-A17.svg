    <g fill="#6A5AA8" stroke="#443A78" stroke-width="3"><circle cx="45" cy="65" r="15"/><circle cx="105" cy="65" r="15"/><circle cx="165" cy="65" r="15"/><circle cx="225" cy="65" r="15"/><circle cx="285" cy="65" r="15"/><circle cx="345" cy="65" r="15"/><circle cx="405" cy="65" r="15"/><circle cx="465" cy="65" r="15"/><circle cx="525" cy="65" r="15"/><circle cx="585" cy="65" r="15"/><circle cx="645" cy="65" r="15"/></g>
    <path d="M45 80V125M105 80V125M165 80V125M225 80V125M285 80V125M345 80V125M405 80V125M465 80V125M525 80V125M585 80V125M645 80V125" stroke="#CE8A33" stroke-width="7"/>
  </g>
  <g id="multi-step-region"><rect x="675" y="450" width="245" height="190" rx="24" fill="#F7E7CD" stroke="#CE8A33" stroke-width="6" stroke-dasharray="13 10"/><circle cx="735" cy="545" r="18" fill="#CE8A33"/><circle cx="798" cy="545" r="18" fill="#CE8A33"/><circle cx="861" cy="545" r="18" fill="#CE8A33"/></g>
