<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="dnaCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="rnaCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf4ff"/>
    </linearGradient>
    <linearGradient id="deoxyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="riboGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    .title-main { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 800; fill: #0f172a; }
    .title-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 500; fill: #64748b; }
    .header-dna { font-family: system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 800; fill: #0369a1; }
    .header-rna { font-family: system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 800; fill: #a21caf; }
    .section-badge { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; }
    .text-bullet { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 500; fill: #1e293b; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 800; fill: #ffffff; }
    .callout-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 800; }
  </style>

  <!-- Nền Canvas -->
  <rect width="960" height="570" fill="#f8fafc" rx="16" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- KHUNG TIÊU ĐỀ ĐẦU TRANG -->
  <g transform="translate(180, 16)" filter="url(#boxShadow)">
    <rect width="600" height="52" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="300" y="24" text-anchor="middle" class="title-main">SO SÁNH CẤU TRÚC PHÂN TỬ DNA VÀ RNA</text>
    <text x="300" y="42" text-anchor="middle" class="title-sub">Đối chiếu 3 tiêu chí cốt lõi: Loại đường Pentose, Base Nitrogen và Cấu trúc mạch</text>
  </g>

  <!-- ==================== CỘT TRÁI: DNA ==================== -->
  <g transform="translate(40, 85)" filter="url(#boxShadow)">
    <rect width="425" height="465" rx="16" fill="url(#dnaCardGrad)" stroke="#bae6fd" stroke-width="2"/>
    
    <!-- Tiêu đề cột DNA -->
    <rect x="20" y="16" width="385" height="38" rx="8" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
    <text x="212.5" y="41" text-anchor="middle" class="header-dna">DNA (Axit Deoxiribonucleic)</text>

    <!-- MỤC 1: ĐƯỜNG PENTOSE -->
    <g transform="translate(20, 68)">
      <rect width="385" height="75" rx="10" fill="#ffffff" stroke="#e0f2fe" stroke-width="1.5"/>
      <!-- Badge Tiêu đề mục -->
      <rect x="12" y="8" width="180" height="22" rx="6" fill="#0284c7"/>
      <text x="102" y="23" text-anchor="middle" class="badge-text">1. ĐƯỜNG PENTOSE (5C)</text>
      <!-- Icon đường -->
      <polygon points="35,46 48,56 43,70 27,70 22,56" fill="url(#deoxyGrad)"/>
      <!-- Nội dung đường -->
      <text x="60" y="48" class="text-bullet" font-weight="700">Đường Deoxyribose (C₅H₁₀O₄)</text>
      <text x="60" y="66" class="callout-text" fill="#0284c7">• Vị trí C2' là nhóm: -H (Thiếu 1 nguyên tử O)</text>
    </g>

    <!-- MỤC 2: BỐN LOẠI BASE NITROGEN -->
    <g transform="translate(20, 155)">
      <rect width="385" height="120" rx="10" fill="#ffffff" stroke="#e0f2fe" stroke-width="1.5"/>
      <!-- Badge Tiêu đề mục -->
      <rect x="12" y="8" width="180" height="22" rx="6" fill="#0284c7"/>
      <text x="102" y="23" text-anchor="middle" class="badge-text">2. BASE NITROGEN (4 LOẠI)</text>
      
      <!-- 4 Badges Base -->
      <g transform="translate(12, 38)">
        <rect x="0" y="0" width="82" height="32" rx="6" fill="#15803d"/>
        <text x="41" y="21" text-anchor="middle" class="badge-text">A (Adenine)</text>

        <rect x="90" y="0" width="85" height="32" rx="6" fill="#b91c1c" stroke="#fca5a5" stroke-width="2"/>
        <text x="132.5" y="21" text-anchor="middle" class="badge-text">T (Thymine)</text>

        <rect x="183" y="0" width="85" height="32" rx="6" fill="#d97706"/>
        <text x="225.5" y="21" text-anchor="middle" class="badge-text">G (Guanine)</text>

        <rect x="276" y="0" width="85" height="32" rx="6" fill="#7e22ce"/>
        <text x="318.5" y="21" text-anchor="middle" class="badge-text">C (Cytosine)</text>
      </g>

      <!-- Khung Callout đặc trưng Thymine -->
      <g transform="translate(12, 80)">
        <rect width="360" height="28" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
        <text x="180" y="19" text-anchor="middle" class="callout-text" fill="#b91c1c">★ ĐẶC TRƯNG: Có THYMINE (T), tuyệt đối KHÔNG có U.</text>
      </g>
    </g>

    <!-- MỤC 3: CẤU TRÚC MẠCH -->
    <g transform="translate(20, 288)">
      <rect width="385" height="158" rx="10" fill="#ffffff" stroke="#e0f2fe" stroke-width="1.5"/>
      <!-- Badge Tiêu đề mục -->
      <rect x="12" y="8" width="180" height="22" rx="6" fill="#0284c7"/>
      <text x="102" y="23" text-anchor="middle" class="badge-text">3. CẤU TRÚC MẠCH DNA</text>

      <!-- Minh họa sơ đồ nhỏ bên trái -->
      <g transform="translate(25, 45)">
        <rect width="90" height="95" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
        <!-- 2 mạch xoắn đối xứng -->
        <path d="M 15 25 Q 45 45 75 25" fill="none" stroke="#0284c7" stroke-width="3"/>
        <path d="M 15 45 Q 45 25 75 45" fill="none" stroke="#0369a1" stroke-width="3"/>
        <line x1="45" y1="35" x2="45" y2="35" stroke="#10b981" stroke-width="4"/>
        <path d="M 15 70 Q 45 90 75 70" fill="none" stroke="#0284c7" stroke-width="3"/>
        <path d="M 15 90 Q 45 70 75 90" fill="none" stroke="#0369a1" stroke-width="3"/>
        <text x="45" y="15" text-anchor="middle" font-family="system-ui" font-size="9" font-weight="700" fill="#0369a1">2 MẠCH</text>
      </g>

      <!-- Khung text chi tiết bên phải -->
      <g transform="translate(130, 38)">
        <text x="0" y="18" class="text-bullet">• Thường gồm <tspan font-weight="800" fill="#0369a1">2 MẠCH</tspan> polynucleotide.</text>
        <text x="0" y="40" class="text-bullet">• Chạy <tspan font-weight="700">ngược chiều</tspan> (5'→3' và 3'→5').</text>
        <text x="0" y="62" class="text-bullet">• Bổ sung: <tspan font-weight="700" fill="#15803d">A = T</tspan> (2H), <tspan font-weight="700" fill="#7e22ce">G ≡ C</tspan> (3H).</text>
        <text x="0" y="84" class="text-bullet">• Xoắn kép quanh trục (B-DNA xoắn phải).</text>
      </g>
    </g>
  </g>

  <!-- ==================== CỘT PHẢI: RNA ==================== -->
  <g transform="translate(495, 85)" filter="url(#boxShadow)">
    <rect width="425" height="465" rx="16" fill="url(#rnaCardGrad)" stroke="#f5d0fe" stroke-width="2"/>
    
    <!-- Tiêu đề cột RNA -->
    <rect x="20" y="16" width="385" height="38" rx="8" fill="#fae8ff" stroke="#f0abfc" stroke-width="1"/>
    <text x="212.5" y="41" text-anchor="middle" class="header-rna">RNA (Axit Ribonucleic)</text>

    <!-- MỤC 1: ĐƯỜNG PENTOSE -->
    <g transform="translate(20, 68)">
      <rect width="385" height="75" rx="10" fill="#ffffff" stroke="#fae8ff" stroke-width="1.5"/>
      <!-- Badge Tiêu đề mục -->
      <rect x="12" y="8" width="180" height="22" rx="6" fill="#a21caf"/>
      <text x="102" y="23" text-anchor="middle" class="badge-text">1. ĐƯỜNG PENTOSE (5C)</text>
      <!-- Icon đường -->
      <polygon points="35,46 48,56 43,70 27,70 22,56" fill="url(#riboGrad)"/>
      <!-- Nội dung đường -->
      <text x="60" y="48" class="text-bullet" font-weight="700">Đường Ribose (C₅H₁₀O₅)</text>
      <text x="60" y="66" class="callout-text" fill="#be123c">• Vị trí C2' là nhóm: -OH (Đầy đủ nguyên tử O)</text>
    </g>

    <!-- MỤC 2: BỐN LOẠI BASE NITROGEN -->
    <g transform="translate(20, 155)">
      <rect width="385" height="120" rx="10" fill="#ffffff" stroke="#fae8ff" stroke-width="1.5"/>
      <!-- Badge Tiêu đề mục -->
      <rect x="12" y="8" width="180" height="22" rx="6" fill="#a21caf"/>
      <text x="102" y="23" text-anchor="middle" class="badge-text">2. BASE NITROGEN (4 LOẠI)</text>
      
      <!-- 4 Badges Base -->
      <g transform="translate(12, 38)">
        <rect x="0" y="0" width="82" height="32" rx="6" fill="#15803d"/>
        <text x="41" y="21" text-anchor="middle" class="badge-text">A (Adenine)</text>

        <rect x="90" y="0" width="85" height="32" rx="6" fill="#e11d48" stroke="#fda4af" stroke-width="2"/>
        <text x="132.5" y="21" text-anchor="middle" class="badge-text">U (Uracil)</text>

        <rect x="183" y="0" width="85" height="32" rx="6" fill="#d97706"/>
        <text x="225.5" y="21" text-anchor="middle" class="badge-text">G (Guanine)</text>

        <rect x="276" y="0" width="85" height="32" rx="6" fill="#7e22ce"/>
        <text x="318.5" y="21" text-anchor="middle" class="badge-text">C (Cytosine)</text>
      </g>

      <!-- Khung Callout đặc trưng Uracil -->
      <g transform="translate(12, 80)">
        <rect width="360" height="28" rx="6" fill="#fff1f2" stroke="#fda4af" stroke-width="1"/>
        <text x="180" y="19" text-anchor="middle" class="callout-text" fill="#e11d48">★ ĐẶC TRƯNG: Có URACIL (U), tuyệt đối KHÔNG có T.</text>
      </g>
    </g>

    <!-- MỤC 3: CẤU TRÚC MẠCH -->
    <g transform="translate(20, 288)">
      <rect width="385" height="158" rx="10" fill="#ffffff" stroke="#fae8ff" stroke-width="1.5"/>
      <!-- Badge Tiêu đề mục -->
      <rect x="12" y="8" width="180" height="22" rx="6" fill="#a21caf"/>
      <text x="102" y="23" text-anchor="middle" class="badge-text">3. CẤU TRÚC MẠCH RNA</text>

      <!-- Minh họa sơ đồ nhỏ bên trái -->
      <g transform="translate(25, 45)">
        <rect width="90" height="95" rx="8" fill="#fdf4ff" stroke="#f5d0fe" stroke-width="1"/>
        <!-- 1 mạch đơn cuộn uốn lượn -->
        <path d="M 20 85 Q 45 40 70 85" fill="none" stroke="#e11d48" stroke-width="4" stroke-linecap="round"/>
        <text x="45" y="25" text-anchor="middle" font-family="system-ui" font-size="9" font-weight="700" fill="#be123c">1 MẠCH</text>
        <text x="45" y="40" text-anchor="middle" font-family="system-ui" font-size="9" font-weight="600" fill="#64748b">5' ──► 3'</text>
      </g>

      <!-- Khung text chi tiết bên phải -->
      <g transform="translate(130, 38)">
        <text x="0" y="18" class="text-bullet">• Thường chỉ gồm <tspan font-weight="800" fill="#be123c">1 MẠCH ĐƠN</tspan>.</text>
        <text x="0" y="40" class="text-bullet">• Chiều mạch: 5' → 3'.</text>
        <text x="0" y="62" class="text-bullet">• Tự cuộn cục bộ (như tRNA cỏ 3 lá, rRNA).</text>
        <text x="0" y="84" class="text-bullet">• Bổ sung cục bộ: <tspan font-weight="700" fill="#15803d">A = U</tspan>, <tspan font-weight="700" fill="#7e22ce">G ≡ C</tspan>.</text>
      </g>
    </g>
  </g>
</svg>
