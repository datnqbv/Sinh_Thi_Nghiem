<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="100%" height="100%">
  <defs>
    <!-- Hiệu ứng đổ bóng mềm -->
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="elementShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>

    <!-- Gradient màu sắc chuẩn Tom Haugomat -->
    <linearGradient id="sugarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="phosphateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
  </defs>

  <style>
    .header-title { font-family: system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 800; fill: #0f172a; }
    .header-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 600; fill: #475569; }
    .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 800; }
    .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 600; }
    .chem-c { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 800; fill: #0284c7; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; }
    .bond-line { stroke: #334155; stroke-width: 3.5; stroke-linecap: round; }
  </style>

  <!-- Nền toàn khung -->
  <rect width="760" height="500" fill="#f8fafc" rx="16" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- KHUNG 1: TIÊU ĐỀ ĐẦU TRANG -->
  <g transform="translate(130, 16)" filter="url(#softShadow)">
    <rect width="500" height="52" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="250" y="24" text-anchor="middle" class="header-title">CẤU TRÚC MỘT NUCLEOTIDE CỦA DNA</text>
    <text x="250" y="42" text-anchor="middle" class="header-sub">Đơn phân cấu tạo gồm 3 thành phần: Phosphate - Đường - Base</text>
  </g>

  <!-- ĐƯỜNG LIÊN KẾT GIỮA CÁC THÀNH PHẦN -->
  <!-- Liên kết Phosphate -> C5' của đường -->
  <line x1="196" y1="200" x2="260" y2="225" class="bond-line"/>
  <!-- Liên kết C1' -> Base Nitrogen -->
  <line x1="442" y1="255" x2="569" y2="240" class="bond-line"/>

  <!-- ==================== 1. NHÓM PHOSPHATE (BÊN TRÁI) ==================== -->
  <!-- KHUNG NEO ĐẦU 5' -->
  <g transform="translate(45, 90)" filter="url(#softShadow)">
    <rect width="210" height="30" rx="15" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
    <circle cx="16" cy="15" r="5" fill="#ef4444"/>
    <text x="115" y="20" text-anchor="middle" class="badge-text" fill="#b91c1c">Đầu 5' (Liên kết phosphodiester)</text>
  </g>
  <line x1="150" y1="120" x2="150" y2="150" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- Hình cầu Phosphate -->
  <g transform="translate(150, 195)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="46" fill="url(#phosphateGrad)" stroke="#b45309" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="800" fill="#ffffff">P</text>
    <text x="0" y="25" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="700" fill="#fef3c7">PO₄³⁻</text>
  </g>

  <!-- KHUNG CHÚ THÍCH NHÓM PHOSPHATE -->
  <g transform="translate(50, 265)" filter="url(#softShadow)">
    <rect width="195" height="52" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    <text x="97.5" y="22" text-anchor="middle" class="box-title" fill="#b45309">Nhóm phosphate</text>
    <text x="97.5" y="40" text-anchor="middle" class="box-sub" fill="#92400e">(Gắn tại vị trí carbon C5')</text>
  </g>

  <!-- ==================== 2. ĐƯỜNG DEOXYRIBOSE (Ở GIỮA) ==================== -->
  <g transform="translate(360, 270)" filter="url(#softShadow)">
    <!-- Ngũ giác pentose -->
    <polygon points="0,-70 70,-15 42,60 -42,60 -70,-15" fill="url(#sugarGrad)" stroke="#0369a1" stroke-width="2"/>
    
    <!-- Cầu oxy C5 -->
    <circle cx="0" cy="-70" r="14" fill="#ffffff" stroke="#0284c7" stroke-width="2.5"/>
    <text x="0" y="-65" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="800" fill="#0284c7">O</text>

    <!-- Khung tròn C1' (gắn base) -->
    <circle cx="70" cy="-15" r="12" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="70" y="-11" text-anchor="middle" class="chem-c">1'</text>

    <!-- Khung tròn C2' và badge đặc trưng Deoxy -->
    <circle cx="42" cy="60" r="12" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="42" y="64" text-anchor="middle" class="chem-c">2'</text>

    <!-- Khung tròn C3' (gắn nucleotide sau) -->
    <circle cx="-42" cy="60" r="12" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="-42" y="64" text-anchor="middle" class="chem-c">3'</text>

    <!-- Khung tròn C4' -->
    <circle cx="-70" cy="-15" r="12" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="-70" y="-11" text-anchor="middle" class="chem-c">4'</text>

    <!-- Nhánh vươn C5' -->
    <line x1="-70" y1="-15" x2="-100" y2="-45" stroke="#ffffff" stroke-width="4"/>
    <circle cx="-100" cy="-45" r="12" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="-100" y="-41" text-anchor="middle" class="chem-c">5'</text>

    <!-- Chữ đường bên trong ngũ giác -->
    <text x="0" y="2" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="800" fill="#ffffff">Đường</text>
    <text x="0" y="20" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="700" fill="#e0f2fe">5 Carbon</text>
  </g>

  <!-- KHUNG BADGE VỊ TRÍ C3' (-OH) -->
  <g transform="translate(245, 325)" filter="url(#softShadow)">
    <rect width="65" height="26" rx="6" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="32.5" y="17" text-anchor="middle" class="badge-text" fill="#0284c7">-OH</text>
  </g>

  <!-- KHUNG BADGE VỊ TRÍ C2' (-H Deoxy) - Tách biệt rõ ràng, không bị che khuất -->
  <g transform="translate(416, 325)" filter="url(#softShadow)">
    <rect width="80" height="26" rx="6" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="40" y="17" text-anchor="middle" class="badge-text" fill="#0284c7">-H (Deoxy)</text>
  </g>

  <!-- KHUNG CHÚ THÍCH ĐƯỜNG DEOXYRIBOSE -->
  <g transform="translate(245, 375)" filter="url(#softShadow)">
    <rect width="220" height="52" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="110" y="22" text-anchor="middle" class="box-title" fill="#0369a1">Đường Deoxyribose</text>
    <text x="110" y="40" text-anchor="middle" class="box-sub" fill="#0284c7">(C₅H₁₀O₄ - Vòng ngũ giác)</text>
  </g>

  <!-- KHUNG NEO ĐẦU 3'-OH -->
  <g transform="translate(245, 442)" filter="url(#softShadow)">
    <rect width="220" height="30" rx="15" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
    <circle cx="16" cy="15" r="5" fill="#ef4444"/>
    <text x="120" y="20" text-anchor="middle" class="badge-text" fill="#b91c1c">Đầu 3'-OH (Kéo dài chuỗi)</text>
  </g>

  <!-- ==================== 3. BASE NITROGEN (BÊN PHẢI) ==================== -->
  <!-- Khối lục giác Base (Đặt tại tâm X=615, Y=240) -->
  <g transform="translate(615, 240)" filter="url(#softShadow)">
    <polygon points="0,-48 46,-24 46,24 0,48 -46,24 -46,-24" fill="url(#baseGrad)" stroke="#581c87" stroke-width="2"/>
    <text x="0" y="-3" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="800" fill="#ffffff">Base</text>
    <text x="0" y="17" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="700" fill="#f3e8ff">nitrogen</text>
  </g>

  <!-- KHUNG CHÚ THÍCH BASE NITROGEN (Đặt tại X=525, Y=335 - Cách -H Deoxy 29px, hoàn toàn không bị che) -->
  <g transform="translate(525, 335)" filter="url(#softShadow)">
    <rect width="186" height="52" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
    <text x="93" y="22" text-anchor="middle" class="box-title" fill="#7e22ce">Base nitrogen</text>
    <text x="93" y="40" text-anchor="middle" class="box-sub" fill="#6b21a8">(Gồm 1 trong 4 loại: A, T, G, C)</text>
  </g>

  <!-- KHUNG LIÊN KẾT HYDRO BỔ SUNG (BÊN PHẢI TRÊN) -->
  <line x1="661" y1="240" x2="695" y2="240" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 3"/>
  <g transform="translate(545, 105)" filter="url(#softShadow)">
    <rect width="185" height="50" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <circle cx="18" cy="25" r="5" fill="#10b981"/>
    <text x="100" y="21" text-anchor="middle" class="badge-text" font-size="12" fill="#047857">Liên kết Hydrogen</text>
    <text x="100" y="38" text-anchor="middle" font-family="system-ui" font-size="10.5" font-weight="600" fill="#065f46">(Bắt cặp A=T hoặc G≡C)</text>
  </g>
</svg>
