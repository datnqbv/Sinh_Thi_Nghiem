<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="eukCellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="nucleusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bactGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    .main-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 800; fill: #0f172a; }
    .main-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 500; fill: #475569; }
    .tag-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 800; fill: #ffffff; }
    .section-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; font-weight: 800; }
    .info-bullet { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 500; fill: #334155; }
    .badge-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; }
    .dna-linear { stroke: #0284c7; stroke-width: 3.5; stroke-linecap: round; fill: none; }
    .dna-circular { stroke: #d97706; stroke-width: 3.5; stroke-linecap: round; fill: none; }
    .dna-plasmid { stroke: #10b981; stroke-width: 3; fill: none; }
  </style>

  <!-- Nền toàn khung -->
  <rect width="960" height="520" fill="#f1f5f9" rx="16" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- KHUNG 1: TIÊU ĐỀ LỚN ĐẦU TRANG -->
  <g transform="translate(180, 16)" filter="url(#boxShadow)">
    <rect width="600" height="52" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="300" y="24" text-anchor="middle" class="main-title">CÁC DẠNG CẤU TRÚC PHÂN TỬ DNA TRONG TỰ NHIÊN</text>
    <text x="300" y="42" text-anchor="middle" class="main-sub">Phân biệt DNA mạch thẳng, DNA mạch vòng vi khuẩn và Plasmid</text>
  </g>

  <!-- ==================== CỘT 1: DNA THẲNG (NHÂN THỰC) ==================== -->
  <g transform="translate(30, 85)" filter="url(#boxShadow)">
    <rect width="280" height="415" rx="14" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- Badge Loại -->
    <rect x="18" y="16" width="135" height="28" rx="14" fill="#0284c7"/>
    <text x="85.5" y="34.5" text-anchor="middle" class="tag-title">1. DNA MẠCH THẲNG</text>

    <!-- Khung hình minh họa -->
    <rect x="18" y="55" width="244" height="175" rx="10" fill="url(#eukCellGrad)" stroke="#7dd3fc" stroke-width="1"/>
    
    <!-- Màng nhân tế bào -->
    <circle cx="140" cy="142" r="62" fill="url(#nucleusGrad)" stroke="#0369a1" stroke-width="2" stroke-dasharray="8 4"/>
    
    <!-- Badge Màng nhân -->
    <g transform="translate(90, 85)">
      <rect width="100" height="22" rx="11" fill="#0369a1"/>
      <text x="50" y="15" text-anchor="middle" class="badge-label" fill="#f0f9ff">MÀNG NHÂN</text>
    </g>

    <!-- DNA sợi thẳng -->
    <path d="M 105 130 Q 120 115 140 135 T 175 125" class="dna-linear" stroke="#ffffff" stroke-width="4"/>
    <path d="M 100 150 Q 125 165 145 140 T 178 155" class="dna-linear" stroke="#fef08a" stroke-width="4"/>
    <path d="M 115 168 Q 135 155 155 170 T 170 160" class="dna-linear" stroke="#ffffff" stroke-width="3.5"/>

    <!-- Khung tiêu đề phụ -->
    <g transform="translate(18, 240)">
      <rect width="244" height="30" rx="8" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
      <text x="122" y="20" text-anchor="middle" class="section-title" fill="#0369a1">DNA trong nhân tế bào</text>
    </g>

    <!-- KHUNG CHỨA TOÀN BỘ CHỮ MÔ TẢ CỘT 1 -->
    <g transform="translate(18, 280)">
      <rect width="244" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="12" y="24" class="info-bullet">• <tspan font-weight="700">Dạng:</tspan> Phân tử sợi thẳng (linear).</text>
      <text x="12" y="48" class="info-bullet">• <tspan font-weight="700">Tổ chức:</tspan> Liên kết protein histone</text>
      <text x="22" y="68" class="info-bullet">tạo thành nhiễm sắc thể (NST).</text>
      <text x="12" y="94" class="info-bullet">• <tspan font-weight="700">Vị trí:</tspan> Trong nhân có màng bọc.</text>
    </g>
  </g>

  <!-- ==================== CỘT 2: DNA VÒNG (VI KHUẨN) ==================== -->
  <g transform="translate(340, 85)" filter="url(#boxShadow)">
    <rect width="280" height="415" rx="14" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- Badge Loại -->
    <rect x="18" y="16" width="135" height="28" rx="14" fill="#d97706"/>
    <text x="85.5" y="34.5" text-anchor="middle" class="tag-title">2. DNA VÒNG LỚN</text>

    <!-- Khung hình minh họa vi khuẩn -->
    <rect x="18" y="55" width="244" height="175" rx="10" fill="url(#bactGrad)" stroke="#fcd34d" stroke-width="1"/>
    
    <!-- Tế bào vi khuẩn hình que capsule -->
    <rect x="42" y="85" width="160" height="115" rx="45" fill="#fef9c3" stroke="#f59e0b" stroke-width="2.5"/>
    
    <!-- Badge Vùng nhân -->
    <g transform="translate(62, 92)">
      <rect width="120" height="22" rx="11" fill="#d97706"/>
      <text x="60" y="15" text-anchor="middle" class="badge-label" fill="#ffffff">VÙNG NHÂN (NUCLEOID)</text>
    </g>

    <!-- DNA vòng đơn phân tử lớn cuộn gập -->
    <path d="M 85 145 C 80 120, 110 115, 125 130 C 145 115, 165 135, 155 155 C 165 175, 130 185, 115 165 C 95 180, 75 160, 85 145 Z" class="dna-circular" stroke="#b45309"/>

    <!-- Khung tiêu đề phụ -->
    <g transform="translate(18, 240)">
      <rect width="244" height="30" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
      <text x="122" y="20" text-anchor="middle" class="section-title" fill="#b45309">DNA vùng nhân vi khuẩn</text>
    </g>

    <!-- KHUNG CHỨA TOÀN BỘ CHỮ MÔ TẢ CỘT 2 -->
    <g transform="translate(18, 280)">
      <rect width="244" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="12" y="24" class="info-bullet">• <tspan font-weight="700">Dạng:</tspan> Phân tử kép mạch vòng.</text>
      <text x="12" y="48" class="info-bullet">• <tspan font-weight="700">Số lượng:</tspan> 1 phân tử DNA duy nhất</text>
      <text x="22" y="68" class="info-bullet">mang gen thiết yếu cho tế bào.</text>
      <text x="12" y="94" class="info-bullet">• <tspan font-weight="700">Đặc điểm:</tspan> Không có màng bọc.</text>
    </g>
  </g>

  <!-- ==================== CỘT 3: PLASMID (DNA VÒNG NHỎ) ==================== -->
  <g transform="translate(650, 85)" filter="url(#boxShadow)">
    <rect width="280" height="415" rx="14" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- Badge Loại -->
    <rect x="18" y="16" width="135" height="28" rx="14" fill="#10b981"/>
    <text x="85.5" y="34.5" text-anchor="middle" class="tag-title">3. PLASMID</text>

    <!-- Khung hình minh họa -->
    <rect x="18" y="55" width="244" height="175" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    
    <!-- Tế bào vi khuẩn chứa chromosome và plasmid -->
    <rect x="42" y="85" width="160" height="115" rx="45" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>

    <!-- DNA NST vi khuẩn mờ hơn ở góc trái -->
    <path d="M 65 145 C 60 130, 85 125, 95 135 C 105 130, 115 145, 105 155 C 85 165, 60 155, 65 145 Z" stroke="#94a3b8" stroke-width="2.5" fill="none"/>
    
    <!-- Badge DNA NST -->
    <g transform="translate(55, 168)">
      <rect width="65" height="20" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="32.5" y="14" text-anchor="middle" class="badge-label" fill="#64748b">DNA NST</text>
    </g>

    <!-- Các vòng Plasmid nhỏ độc lập -->
    <ellipse cx="150" cy="125" rx="18" ry="12" class="dna-plasmid" stroke="#059669" stroke-width="3"/>
    <ellipse cx="160" cy="160" rx="14" ry="10" class="dna-plasmid" stroke="#059669" stroke-width="3"/>
    
    <!-- Badge Plasmid -->
    <g transform="translate(125, 92)">
      <rect width="90" height="22" rx="11" fill="#059669"/>
      <text x="45" y="15" text-anchor="middle" class="badge-label" fill="#ffffff">Plasmid (nhỏ)</text>
    </g>

    <!-- Khung tiêu đề phụ -->
    <g transform="translate(18, 240)">
      <rect width="244" height="30" rx="8" fill="#d1fae5" stroke="#a7f3d0" stroke-width="1"/>
      <text x="122" y="20" text-anchor="middle" class="section-title" fill="#047857">Plasmid (Vòng nhỏ ngoại NST)</text>
    </g>

    <!-- KHUNG CHỨA TOÀN BỘ CHỮ MÔ TẢ CỘT 3 -->
    <g transform="translate(18, 280)">
      <rect width="244" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="12" y="24" class="info-bullet">• <tspan font-weight="700">Dạng:</tspan> Vòng xoắn kép nhỏ.</text>
      <text x="12" y="48" class="info-bullet">• <tspan font-weight="700">Đặc tính:</tspan> Tách biệt với DNA NST,</text>
      <text x="22" y="68" class="info-bullet">tự nhân đôi độc lập trong TB chất.</text>
      <text x="12" y="94" class="info-bullet">• <tspan font-weight="700">Vai trò:</tspan> Mang gen phụ (kháng sinh).</text>
    </g>
  </g>
</svg>
