<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="100%" height="100%">
  <defs>
    <linearGradient id="naGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="520" height="400" rx="16" fill="url(#naGrad)" stroke="#c084fc" stroke-width="2"/>
  
  <!-- KHUNG TIÊU ĐỀ CARD -->
  <g transform="translate(25, 18)" filter="url(#badgeShadow)">
    <rect width="470" height="44" rx="10" fill="#f3e8ff" stroke="#c084fc" stroke-width="1.5"/>
    <text x="235" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#7e22ce">4. NUCLEIC ACID (ĐẠI DIỆN: CẶP BASE DNA A=T)</text>
  </g>

  <!-- CẶP BASE BỔ SUNG A=T (2 MẠCH NGƯỢC CHIỀU) -->
  <g transform="translate(60, 95)">
    <!-- 1. Nucleotide A bên trái (Mạch 5' -> 3') -->
    <g transform="translate(15, 30)">
      <!-- Nhóm Phosphate trong khung tròn -->
      <circle cx="0" cy="0" r="22" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="800" fill="#ffffff">P</text>
      
      <!-- Liên kết -->
      <line x1="18" y1="12" x2="45" y2="40" stroke="#334155" stroke-width="3"/>
      
      <!-- Đường Deoxyribose -->
      <polygon points="65,15 92,45 80,75 50,75 38,45" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
      <text x="65" y="50" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="700" fill="#ffffff">Đường</text>
      
      <!-- Liên kết -->
      <line x1="88" y1="45" x2="115" y2="45" stroke="#334155" stroke-width="3"/>
      
      <!-- Base A (Khung xanh lá) -->
      <rect x="115" y="25" width="55" height="40" rx="8" fill="#15803d" stroke="#166534" stroke-width="2"/>
      <text x="142.5" y="50" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="800" fill="#ffffff">A</text>
    </g>

    <!-- 2. KHUNG BADGE 2 LIÊN KẾT HYDRO (Ở GIỮA) -->
    <g transform="translate(190, 20)" filter="url(#badgeShadow)">
      <rect width="90" height="24" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
      <text x="45" y="16" text-anchor="middle" font-family="system-ui" font-size="10.5" font-weight="800" fill="#047857">2 LIÊN KẾT H</text>
    </g>
    <!-- 2 đường đứt nét liên kết hydro -->
    <line x1="190" y1="65" x2="225" y2="65" stroke="#10b981" stroke-width="3" stroke-dasharray="4 3"/>
    <line x1="190" y1="85" x2="225" y2="85" stroke="#10b981" stroke-width="3" stroke-dasharray="4 3"/>

    <!-- 3. Nucleotide T bên phải (Mạch 3' -> 5') -->
    <g transform="translate(230, 30)">
      <!-- Base T (Khung đỏ) -->
      <rect x="0" y="25" width="55" height="40" rx="8" fill="#b91c1c" stroke="#991b1b" stroke-width="2"/>
      <text x="27.5" y="50" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="800" fill="#ffffff">T</text>
      
      <!-- Liên kết -->
      <line x1="55" y1="45" x2="82" y2="45" stroke="#334155" stroke-width="3"/>
      
      <!-- Đường Deoxyribose ngược -->
      <polygon points="105,75 132,45 120,15 90,15 78,45" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
      <text x="105" y="50" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="700" fill="#ffffff">Đường</text>
      
      <!-- Liên kết -->
      <line x1="125" y1="35" x2="150" y2="10" stroke="#334155" stroke-width="3"/>
      
      <!-- Nhóm Phosphate trong khung tròn -->
      <circle cx="165" cy="0" r="22" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
      <text x="165" y="5" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="800" fill="#ffffff">P</text>
    </g>

    <!-- 4. KHUNG BADGE CHIỀU HAI MẠCH NGƯỢC CHIỀU -->
    <!-- Mạch 1: 5' -> 3' -->
    <g transform="translate(25, 140)" filter="url(#badgeShadow)">
      <rect width="150" height="26" rx="13" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
      <text x="75" y="17" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="800" fill="#0369a1">Mạch 1: 5' ───► 3'</text>
    </g>
    <!-- Mạch 2: 3' <- 5' -->
    <g transform="translate(230, 140)" filter="url(#badgeShadow)">
      <rect width="150" height="26" rx="13" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
      <text x="75" y="17" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="800" fill="#b91c1c">Mạch 2: 3' ◄─── 5'</text>
    </g>
  </g>

  <!-- KHUNG TÓM TẮT ĐẶC ĐIỂM DƯỚI ĐÁY -->
  <g transform="translate(25, 315)" filter="url(#badgeShadow)">
    <rect width="470" height="65" rx="10" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5"/>
    <text x="16" y="26" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#334155">• <tspan font-weight="800" fill="#7e22ce">Đơn phân:</tspan> Nucleotide (Đường pentose + Nhóm phosphate + Base nitrogen).</text>
    <text x="16" y="48" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#334155">• <tspan font-weight="800" fill="#7e22ce">Chức năng:</tspan> Lưu trữ, bảo quản và truyền đạt thông tin di truyền.</text>
  </g>
</svg>
