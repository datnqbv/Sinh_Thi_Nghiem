<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="100%" height="100%">
  <defs>
    <linearGradient id="protGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf2f8"/>
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="520" height="400" rx="16" fill="url(#protGrad)" stroke="#f472b6" stroke-width="2"/>
  
  <!-- KHUNG TIÊU ĐỀ CARD -->
  <g transform="translate(25, 18)" filter="url(#badgeShadow)">
    <rect width="470" height="44" rx="10" fill="#fce7f3" stroke="#f472b6" stroke-width="1.5"/>
    <text x="235" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#be185d">3. PROTEIN (ĐẠI DIỆN: CHUỖI POLYPEPTIDE)</text>
  </g>

  <!-- CẤU TRÚC DI-PEPTIDE -->
  <g transform="translate(50, 95)">
    <!-- KHUNG ĐỨT NÉT BAO QUANH LIÊN KẾT PEPTIDE -->
    <rect x="155" y="15" width="125" height="135" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="2" stroke-dasharray="6 4"/>
    
    <!-- BADGE LIÊN KẾT PEPTIDE -->
    <g transform="translate(160, 160)" filter="url(#badgeShadow)">
      <rect width="115" height="26" rx="6" fill="#be185d"/>
      <text x="57.5" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#ffffff">LIÊN KẾT PEPTIDE</text>
    </g>

    <!-- ===== AMINO ACID 1 (TRÁI) ===== -->
    <g transform="translate(15, 35)">
      <!-- 1. Khung Nhóm Amino H2N -->
      <g filter="url(#badgeShadow)">
        <rect x="0" y="18" width="55" height="34" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
        <text x="27.5" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0369a1">H₂N</text>
      </g>
      
      <!-- Liên kết -->
      <line x1="55" y1="35" x2="85" y2="35" stroke="#334155" stroke-width="3"/>
      
      <!-- 2. Khung Carbon Cα 1 -->
      <circle cx="95" cy="35" r="16" fill="#ffffff" stroke="#334155" stroke-width="2"/>
      <text x="95" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#334155">Cα</text>

      <!-- 3. Khung Nhóm R1 (ở trên) -->
      <line x1="95" y1="19" x2="95" y2="-2" stroke="#334155" stroke-width="2.5"/>
      <g transform="translate(77, -26)" filter="url(#badgeShadow)">
        <rect width="36" height="24" rx="6" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
        <text x="18" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#854d0e">R₁</text>
      </g>

      <!-- Liên kết tới C=O -->
      <line x1="111" y1="35" x2="155" y2="35" stroke="#334155" stroke-width="3"/>

      <!-- 4. Khung Carbonyl C=O -->
      <g transform="translate(145, 18)" filter="url(#badgeShadow)">
        <rect width="36" height="34" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
        <text x="18" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#b91c1c">C=O</text>
      </g>
    </g>

    <!-- ===== AMINO ACID 2 (PHẢI) ===== -->
    <g transform="translate(235, 35)">
      <!-- 5. Khung Amide N-H -->
      <g transform="translate(0, 18)" filter="url(#badgeShadow)">
        <rect width="36" height="34" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
        <text x="18" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0369a1">N-H</text>
      </g>

      <!-- Liên kết tới Cα 2 -->
      <line x1="36" y1="35" x2="65" y2="35" stroke="#334155" stroke-width="3"/>

      <!-- 6. Khung Carbon Cα 2 -->
      <circle cx="78" cy="35" r="16" fill="#ffffff" stroke="#334155" stroke-width="2"/>
      <text x="78" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#334155">Cα</text>

      <!-- 7. Khung Nhóm R2 (ở trên) -->
      <line x1="78" y1="19" x2="78" y2="-2" stroke="#334155" stroke-width="2.5"/>
      <g transform="translate(60, -26)" filter="url(#badgeShadow)">
        <rect width="36" height="24" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
        <text x="18" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#15803d">R₂</text>
      </g>

      <!-- Liên kết tới COOH -->
      <line x1="94" y1="35" x2="125" y2="35" stroke="#334155" stroke-width="3"/>

      <!-- 8. Khung Nhóm Carboxyl -COOH -->
      <g transform="translate(125, 18)" filter="url(#badgeShadow)">
        <rect width="60" height="34" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
        <text x="30" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#be185d">COOH</text>
      </g>
    </g>
  </g>

  <!-- KHUNG TÓM TẮT ĐẶC ĐIỂM DƯỚI ĐÁY -->
  <g transform="translate(25, 315)" filter="url(#badgeShadow)">
    <rect width="470" height="65" rx="10" fill="#ffffff" stroke="#fbcfe8" stroke-width="1.5"/>
    <text x="16" y="26" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#334155">• <tspan font-weight="800" fill="#be185d">Đơn phân:</tspan> 20 loại Amino acid kết nối bằng liên kết peptide (-CO-NH-).</text>
    <text x="16" y="48" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#334155">• <tspan font-weight="800" fill="#be185d">Cấu trúc:</tspan> Bậc 1 → Bậc 2 → Bậc 3 → Bậc 4 tạo nên đa dạng chức năng sinh học.</text>
  </g>
</svg>
