<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="100%" height="100%">
  <defs>
    <linearGradient id="carbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="520" height="400" rx="16" fill="url(#carbGrad)" stroke="#86efac" stroke-width="2"/>
  
  <!-- KHUNG TIÊU ĐỀ CARD -->
  <g transform="translate(25, 18)" filter="url(#badgeShadow)">
    <rect width="470" height="44" rx="10" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
    <text x="235" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#15803d">1. CARBOHYDRATE (ĐẠI DIỆN: GLUCOSE)</text>
  </g>

  <!-- CẤU TRÚC VÒNG HAWORTH GLUCOSE -->
  <g transform="translate(125, 105)">
    <!-- Vòng 6 cạnh Haworth -->
    <polygon points="140,25 220,55 200,135 80,135 60,55" fill="#bbf7d0" fill-opacity="0.3" stroke="#166534" stroke-width="4.5" stroke-linejoin="round"/>
    
    <!-- Cầu Oxy đỉnh trên bên phải (Trong khung tròn riêng) -->
    <circle cx="180" cy="40" r="17" fill="#ffffff" stroke="#15803d" stroke-width="3"/>
    <text x="180" y="47" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#15803d">O</text>

    <!-- Nhóm -CH2OH tại C5 (Trong khung badge bo góc) -->
    <line x1="80" y1="45" x2="65" y2="5" stroke="#166534" stroke-width="3.5"/>
    <g transform="translate(25, -18)" filter="url(#badgeShadow)">
      <rect width="70" height="26" rx="13" fill="#ffffff" stroke="#166534" stroke-width="1.5"/>
      <text x="35" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#166534">CH₂OH</text>
    </g>

    <!-- Các nhóm -OH phân nhánh (Mỗi nhóm đều nằm trong khung badge tròn/oval riêng) -->
    <!-- OH tại C1 -->
    <line x1="220" y1="55" x2="250" y2="70" stroke="#166534" stroke-width="3"/>
    <g transform="translate(245, 55)" filter="url(#badgeShadow)">
      <rect width="42" height="24" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
      <text x="21" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#15803d">OH</text>
    </g>

    <!-- OH tại C2 -->
    <line x1="200" y1="135" x2="225" y2="160" stroke="#166534" stroke-width="3"/>
    <g transform="translate(220, 150)" filter="url(#badgeShadow)">
      <rect width="42" height="24" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
      <text x="21" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#15803d">OH</text>
    </g>

    <!-- OH tại C3 -->
    <line x1="80" y1="135" x2="65" y2="165" stroke="#166534" stroke-width="3"/>
    <g transform="translate(40, 155)" filter="url(#badgeShadow)">
      <rect width="42" height="24" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
      <text x="21" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#15803d">OH</text>
    </g>

    <!-- OH tại C4 -->
    <line x1="60" y1="55" x2="25" y2="55" stroke="#166534" stroke-width="3"/>
    <g transform="translate(-10, 43)" filter="url(#badgeShadow)">
      <rect width="42" height="24" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
      <text x="21" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#15803d">OH</text>
    </g>
  </g>

  <!-- KHUNG TÓM TẮT ĐẶC ĐIỂM DƯỚI ĐÁY -->
  <g transform="translate(25, 315)" filter="url(#badgeShadow)">
    <rect width="470" height="65" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="16" y="26" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#334155">• <tspan font-weight="800" fill="#15803d">Đơn phân:</tspan> Monosaccharide (Glucose, Fructose...).</text>
    <text x="16" y="48" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#334155">• <tspan font-weight="800" fill="#15803d">Chức năng:</tspan> Cung cấp năng lượng ngắn hạn, cấu tạo vách tế bào.</text>
  </g>
</svg>
