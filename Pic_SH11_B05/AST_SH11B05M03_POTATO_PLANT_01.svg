<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 450" width="350" height="450">
  <g id="AST_SH11B05M03_POTATO_PLANT_01">
    <!-- Terracotta Pot Base -->
    <polygon points="100,340 250,340 230,430 120,430" fill="#D35400" stroke="#A04000" stroke-width="4"/>
    <rect x="90" y="315" width="170" height="30" rx="4" fill="#E67E22" stroke="#A04000" stroke-width="4"/>

    <!-- Plant Stems -->
    <path d="M 175 320 Q 175 200 140 100" fill="none" stroke="#27AE60" stroke-width="8" stroke-linecap="round"/>
    <path d="M 175 280 Q 220 220 250 140" fill="none" stroke="#27AE60" stroke-width="6" stroke-linecap="round"/>
    <path d="M 165 240 Q 110 180 90 120" fill="none" stroke="#27AE60" stroke-width="5" stroke-linecap="round"/>

    <!-- Compound Leaves Cluster (Lá kép khoai tây) -->
    <!-- Center Top Compound Leaf -->
    <g transform="translate(140, 70) scale(0.6)">
      <path d="M 0 0 C 40 -30 60 -80 0 -120 C -60 -80 -40 -30 0 0 Z" fill="#2ECC71" stroke="#27AE60" stroke-width="3"/>
      <path d="M 40 -20 C 80 -40 100 -70 50 -90 C 20 -70 20 -40 40 -20 Z" fill="#2ECC71" stroke="#27AE60" stroke-width="2"/>
      <path d="M -40 -20 C -80 -40 -100 -70 -50 -90 C -20 -70 -20 -40 -40 -20 Z" fill="#2ECC71" stroke="#27AE60" stroke-width="2"/>
    </g>

    <!-- Right Compound Leaf (Target Leaflet Branch) -->
    <g transform="translate(250, 130) rotate(35) scale(0.75)">
      <path d="M 0 0 C 40 -30 60 -80 0 -120 C -60 -80 -40 -30 0 0 Z" fill="#3CA57A" stroke="#2D6A4F" stroke-width="4" id="target_leaflet"/>
      <path d="M 40 -20 C 80 -40 100 -70 50 -90 C 20 -70 20 -40 40 -20 Z" fill="#3CA57A" stroke="#2D6A4F" stroke-width="3"/>
      <path d="M -40 -20 C -80 -40 -100 -70 -50 -90 C -20 -70 -20 -40 -40 -20 Z" fill="#3CA57A" stroke="#2D6A4F" stroke-width="3"/>
    </g>

    <!-- Left Compound Leaf -->
    <g transform="translate(90, 110) rotate(-40) scale(0.65)">
      <path d="M 0 0 C 40 -30 60 -80 0 -120 C -60 -80 -40 -30 0 0 Z" fill="#2ECC71" stroke="#27AE60" stroke-width="3"/>
      <path d="M 40 -20 C 80 -40 100 -70 50 -90 C 20 -70 20 -40 40 -20 Z" fill="#2ECC71" stroke="#27AE60" stroke-width="2"/>
      <path d="M -40 -20 C -80 -40 -100 -70 -50 -90 C -20 -70 -20 -40 -40 -20 Z" fill="#2ECC71" stroke="#27AE60" stroke-width="2"/>
    </g>
  </g>
</svg>
