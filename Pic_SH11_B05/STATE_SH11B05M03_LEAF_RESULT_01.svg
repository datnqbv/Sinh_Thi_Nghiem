<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <!-- Potato Leaflet Result After Iodine - 2 Color Zones -->
  <g id="STATE_SH11B05M03_LEAF_RESULT_01">
    <defs>
      <!-- Clip path matching the exact leaflet outline -->
      <clipPath id="leafletClip">
        <path d="M 150 40 
                 C 230 100, 260 210, 220 300 
                 C 190 350, 160 360, 150 360 
                 C 140 360, 110 350, 80 300 
                 C 40 210, 70 100, 150 40 Z"/>
      </clipPath>
    </defs>

    <!-- Petiole / Cuống lá -->
    <path d="M 150 350 Q 150 375 148 395" fill="none" stroke="#A88242" stroke-width="8" stroke-linecap="round"/>

    <!-- Base Leaflet filled with Yellow-Brown (Negative Iodine Base) -->
    <path d="M 150 40 
             C 230 100, 260 210, 220 300 
             C 190 350, 160 360, 150 360 
             C 140 360, 110 350, 80 300 
             C 40 210, 70 100, 150 40 Z" 
          fill="#D9A84E" stroke="#8C6627" stroke-width="4"/>

    <!-- Top & Bottom Illuminated Positive Starch Zones (Dark Blue-Purple #1D2254) -->
    <g clip-path="url(#leafletClip)">
      <!-- Top Zone (Illuminated) -->
      <rect x="0" y="0" width="300" height="150" fill="#1D2254"/>
      <!-- Bottom Zone (Illuminated) -->
      <rect x="0" y="240" width="300" height="160" fill="#1D2254"/>

      <!-- Middle Zone is left uncovered -> shows Yellow-Brown #D9A84E (Covered by Black Paper) -->
      
      <!-- Subtle Texture Overlay for organic leaf look -->
      <line x1="0" y1="150" x2="300" y2="150" stroke="#101438" stroke-width="3" opacity="0.6"/>
      <line x1="0" y1="240" x2="300" y2="240" stroke="#101438" stroke-width="3" opacity="0.6"/>
    </g>

    <!-- Vein Overlay -->
    <path d="M 150 45 Q 150 200 150 360" fill="none" stroke="#101438" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
    <path d="M 150 110 Q 185 95 210 105" fill="none" stroke="#101438" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
    <path d="M 150 110 Q 115 95 90 105" fill="none" stroke="#101438" stroke-width="2" opacity="0.6" stroke-linecap="round"/>

    <path d="M 150 195 Q 195 180 225 195" fill="none" stroke="#7A561B" stroke-width="2" opacity="0.8" stroke-linecap="round"/>
    <path d="M 150 195 Q 105 180 75 195" fill="none" stroke="#7A561B" stroke-width="2" opacity="0.8" stroke-linecap="round"/>

    <path d="M 150 290 Q 190 280 210 300" fill="none" stroke="#101438" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
    <path d="M 150 290 Q 110 280 90 300" fill="none" stroke="#101438" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
  </g>
</svg>
