<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <!-- Potato Leaflet - Editorial Flat Tom Haugomat Style -->
  <g id="AST_SH11B05M03_POTATO_LEAFLET_01">
    <!-- Petiole / Cuống lá -->
    <path d="M 150 350 Q 150 375 148 395" fill="none" stroke="#2D6A4F" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Leaf Blade / Phiến lá chét khoai tây -->
    <path d="M 150 40 
             C 230 100, 260 210, 220 300 
             C 190 350, 160 360, 150 360 
             C 140 360, 110 350, 80 300 
             C 40 210, 70 100, 150 40 Z" 
          fill="#3CA57A" stroke="#2D6A4F" stroke-width="4"/>
    
    <!-- Shadow Side / Mảng tối editorial nhẹ -->
    <path d="M 150 40 
             C 195 100, 215 210, 185 300 
             C 165 350, 153 360, 150 360 Z" 
          fill="#2D8B6F" opacity="0.4"/>

    <!-- Main Vein / Gân chính -->
    <path d="M 150 45 Q 150 200 150 360" fill="none" stroke="#1F4E3D" stroke-width="4" stroke-linecap="round"/>

    <!-- Side Veins / Gân phụ -->
    <path d="M 150 110 Q 185 95 210 105" fill="none" stroke="#2D6A4F" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 150 110 Q 115 95 90 105" fill="none" stroke="#2D6A4F" stroke-width="2.5" stroke-linecap="round"/>

    <path d="M 150 170 Q 195 155 225 170" fill="none" stroke="#2D6A4F" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 150 170 Q 105 155 75 170" fill="none" stroke="#2D6A4F" stroke-width="2.5" stroke-linecap="round"/>

    <path d="M 150 230 Q 190 220 210 240" fill="none" stroke="#2D6A4F" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 150 230 Q 110 220 90 240" fill="none" stroke="#2D6A4F" stroke-width="2.5" stroke-linecap="round"/>

    <path d="M 150 290 Q 175 285 190 300" fill="none" stroke="#2D6A4F" stroke-width="2" stroke-linecap="round"/>
    <path d="M 150 290 Q 125 285 110 300" fill="none" stroke="#2D6A4F" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
