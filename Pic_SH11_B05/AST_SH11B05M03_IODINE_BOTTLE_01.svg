<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 260" width="160" height="260">
  <g id="AST_SH11B05M03_IODINE_BOTTLE_01">
    <!-- Dropper Cap / Nắp ống nhỏ giọt -->
    <rect x="70" y="10" width="20" height="25" rx="4" fill="#333333"/>
    <path d="M 60 35 L 100 35 L 95 65 L 65 65 Z" fill="#222222"/>
    
    <!-- Bottle Neck -->
    <rect x="62" y="65" width="36" height="25" fill="#B87333" opacity="0.9"/>
    
    <!-- Bottle Body (Amber Glass) -->
    <path d="M 40 90 L 120 90 A 10 10 0 0 1 130 100 L 130 230 A 10 10 0 0 1 120 240 L 40 240 A 10 10 0 0 1 30 230 L 30 100 A 10 10 0 0 1 40 90 Z" 
          fill="#A65B17" stroke="#783E0E" stroke-width="4"/>

    <!-- Yellow-Brown Iodine Liquid Inside -->
    <rect x="35" y="130" width="90" height="100" rx="4" fill="#D9A84E" opacity="0.85"/>
    
    <!-- White Label Container -->
    <rect x="42" y="135" width="76" height="65" rx="3" fill="#FAF7F0" stroke="#CCCCCC" stroke-width="1.5"/>
    <text x="80" y="162" font-family="sans-serif" font-weight="bold" font-size="14" fill="#1A1A1A" text-anchor="middle">IODINE</text>
    <text x="80" y="180" font-family="sans-serif" font-size="11" fill="#D9A84E" text-anchor="middle">KI / I₂ Sol.</text>
  </g>
</svg>
